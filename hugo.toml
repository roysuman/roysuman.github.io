baseURL = 'https://sigcont.me/'
languageCode = 'en-us'
title = 'sigcont'
theme = 'PaperMod'

[markup.goldmark.renderer]
    unsafe = true

[params]
    defaultTheme = "light"
    showCodeCopyButtons = true
    showReadingTime = true
    displayFullContent = false
    hideFooter = false
    showFullContent = false
    hidePageTree = true
    disableThemeToggle = false

[params.homeInfoParams]
    Title = "Hey, I am Suman"
    Content = """
<div style="color: #333; font-weight: bold; font-size: 1.25em; margin-bottom: 20px; line-height: 1.4;">I am an engineer, architect, mentor, systems researcher, and a skeptic of anything that hasn't been tested at scale.</div>
<p style="margin-bottom: 20px; line-height: 1.6;">I build systems that have no choice but to work. A decade at <strong>AWS</strong> taught me that at the exabyte scale, software is just a way to manage the physics and economics of hardware. My time in the internals of <strong>S3 Glacier</strong> was a masterclass in this balance: maintaining 20-nines of durability while driving costs to the floor.</p>
<p style="margin-bottom: 20px; line-height: 1.6;">I learned that true depth is found in the precision of data layouts, the violence of garbage collection, and building migration pipelines that move petabytes without losing a bit. It is an operational posture where you repair state faster than entropy can destroy it.</p>
<p style="margin-bottom: 25px; line-height: 1.6;">Today, I apply this obsession to <strong>AWS Bedrock</strong>. The challenge has shifted from data-at-rest to hardware scarcity. We architect sub-minute cluster lifecycles and abstraction layers to squeeze every drop of utility out of a constrained infrastructure footprint.</p>
<p style="margin-bottom: 25px; line-height: 1.6;"><strong>Mechanical sympathy is an invariant:</strong> high-quality design is an illusion if it fails to respect the constraints and capabilities of the underlying hardware. With this conviction, I am resuming my 'past form' after a four-year hiatus for family. This site is my <strong>Write-Ahead Log (WAL)</strong>—a persistent record of the research, books, and architectural artifacts that define my filter on systems, serving as my <strong>Running Sum</strong> and a roadmap for recapping a decade of mastery in large-scale operations and mentorship.</p>
"""

[[menu.main]]
    name = "Posts"
    url = "/posts"
    weight = 10

[[menu.main]]
    name = "Reading List"
    url = "/reading-list"
    weight = 20

[[menu.main]]
    name = "Scratchpad"
    url = "/categories/scratchpad"
    weight = 30

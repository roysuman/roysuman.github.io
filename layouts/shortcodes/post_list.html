<div class="post-links-wrapper">
  {{ range (where .Site.RegularPages "Section" "blogs") }}
    <article style="margin-bottom: 1.5rem;">
      <a href="{{ .RelPermalink }}" style="font-size: 1.25rem; font-weight: bold; color: #222; text-decoration: none;">
        {{ .Title }}
      </a>
      <p style="margin: 0.2rem 0; color: #666; font-size: 0.9rem;">
        {{ .Date.Format "January 2, 2006" }}
      </p>
      {{ if .Description }}
        <p style="margin-top: 0.5rem;">{{ .Description }}</p>
      {{ end }}
    </article>
  {{ end }}
</div>
